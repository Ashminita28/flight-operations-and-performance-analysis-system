openapi: 3.0.0
info:
  title: Operations Service
  version: 1.0.0

servers:
  - url: http://localhost

paths:
  /api/operations/events:
    get:
      summary: Get all operational events
      tags: [Events]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of all events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperationalEvent"

  /api/operations/{flightId}/events:
    post:
      summary: Create operational event
      tags: [Events]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: flightId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOperationalEventDTO"
      responses:
        "201":
          description: Event created

  /api/operations/{flight_id}/events:
    get:
      summary: Get events by flight
      tags: [Events]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: flight_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Events for flight
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperationalEvent"

  /api/operations/{flightId}/events/{id}:
    put:
      summary: Update operational event
      tags: [Events]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: flightId
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOperationalEventDTO"
      responses:
        "200":
          description: Event updated

components:
  schemas:
    CreateOperationalEventDTO:
      type: object
      required:
        - flight_id
        - severity
      properties:
        flight_id:
          type: string
        event_type:
          type: string
        delay_category_id:
          type: string
        delay_minutes:
          type: integer
        description:
          type: string
        event_time:
          type: string
          format: date-time
        severity:
          type: string

    UpdateOperationalEventDTO:
      type: object
      properties:
        event_type:
          type: string
        delay_category_id:
          type: string
        delay_minutes:
          type: integer
        description:
          type: string
        event_time:
          type: string
          format: date-time
        severity:
          type: string

    OperationalEvent:
      type: object
      properties:
        id:
          type: string
        flight_id:
          type: string
        event_type:
          type: string
        delay_category_id:
          type: string
        delay_minutes:
          type: integer
        description:
          type: string
        event_time:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
        severity:
          type: string
        reported_by:
          type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
