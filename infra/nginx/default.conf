server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # FRONTEND ROUTES 
    location / {
        try_files $uri /index.html;
    }

    # AUTH SERVICE
    location /api/auth/ {
        proxy_pass http://auth-service:3000/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; HttpOnly; Secure; SameSite=Lax";
    }


    location /api/admin/ {
        proxy_pass http://auth-service:3000/api/admin/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cookie_path / "/; HttpOnly; Secure; SameSite=Lax";
    }


    location /api/user/ {
        proxy_pass http://auth-service:3000/api/user/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cookie_path / "/; HttpOnly; Secure; SameSite=Lax";
    }



    # AIRCRAFT SERVICE
    location /api/aircraft/ {
        proxy_pass http://aircraft-service:3002/api/aircraft/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cookie_path / "/; HttpOnly; Secure; SameSite=Lax";
    }



    # FLIGHT SERVICE
    location /api/flights/ {
        proxy_pass http://flight-service:3001/api/flights/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; HttpOnly; Secure; SameSite=Lax";
    }
    # OPERATIONAL SERVICE
    location /api/operations/ {
    proxy_pass http://operational-event-service:3004/api/operations/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cookie_path / "/; HttpOnly; Secure; SameSite=Lax";
}

    # OPERATIONAL SERVICE - DELAYS
    location /api/delays/ {
        proxy_pass http://operational-event-service:3004/api/delays/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; HttpOnly; Secure; SameSite=Lax";
    }
    # PERFORMANCE SERVICE 
    location /api/performance/ {
        proxy_pass http://performance-capture-service:3005/api/performance/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; HttpOnly; Secure; SameSite=Lax";
    }
    
    # WORKER NOTIFICATION SERVICE
    location /api/notifications/ {
        proxy_pass http://worker-service:3008/api/notifications/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; HttpOnly; Secure; SameSite=Lax";
    }
    # WORKER ANAYTICS SERVICE
    location /api/analytics/ {
        proxy_pass http://worker-service:3008/api/analytics/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; HttpOnly; Secure; SameSite=Lax";
    }
    
    # Swagger UI
location /api-docs {
    proxy_pass http://auth-service:3000/api-docs;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# Swagger YAML files
location /swagger/ {
    proxy_pass http://auth-service:3000/swagger/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
 
   
}