server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # FRONTEND ROUTES 
    location / {
        try_files $uri /index.html;
    }

    # AUTH SERVICE
    location /api/auth/ {
        proxy_pass http://auth-service:3000/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; HttpOnly; SameSite=Lax";
    }


    location /api/user/ {
        proxy_pass http://auth-service:3000/api/user/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cookie_path / "/; HttpOnly; SameSite=Lax";
    }


    location /api/admin/ {
        proxy_pass http://auth-service:3000/api/admin/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cookie_path / "/; HttpOnly; SameSite=Lax";
    }


    location /api/password/ {
        proxy_pass http://auth-service:3000/api/password/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cookie_path / "/; HttpOnly; SameSite=Lax";
    }



    # AIRCRAFT SERVICE
    location /api/aircraft/ {
        proxy_pass http://aircraft-service:3002/api/aircraft/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cookie_path / "/; HttpOnly; SameSite=Lax";
    }



    # FLIGHT SERVICE
    location /api/flights/ {
        proxy_pass http://flight-service:3001/api/flights/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; HttpOnly; SameSite=Lax";
    }

    location /api/crews/ {
        proxy_pass http://flight-service:3001/api/crews/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; HttpOnly; SameSite=Lax";
    }

    location /api/events/ {
        proxy_pass http://flight-service:3001/api/events/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; HttpOnly; SameSite=Lax";
    }

    # SWAGGER
    location /docs/ {
        proxy_pass http://auth-service:3000/docs/;
    }
}