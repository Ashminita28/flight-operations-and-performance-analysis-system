services:
  postgres:
    image: postgres:15
    container_name: aviation-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${POSTGRES_DATA_PATH}/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: aviation_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - ${RABBITMQ_DATA_PATH}:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    container_name: auth_service
    env_file:
      - ./.env
      - ./apps/auth-service/.env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  aircraft-service:
    build:
      context: .
      dockerfile: apps/aircraft-service/Dockerfile
    container_name: aircraft_service
    env_file:
      - ./.env
      - ./apps/aircraft-service/.env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  flight-service:
    build:
      context: .
      dockerfile: apps/flight-service/Dockerfile
    container_name: flight_service
    env_file:
      - ./.env
      - ./apps/flight-service/.env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  operational-event-service:
    build:
      context: .
      dockerfile: apps/operational-event-service/Dockerfile
    container_name: operational_event_service
    env_file:
      - ./.env
      - ./apps/operational-event-service/.env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  performance-capture-service:
    build:
      context: .
      dockerfile: apps/performance-capture-service/Dockerfile
    container_name: performance_capture_service
    env_file:
      - ./.env
      - ./apps/performance-capture-service/.env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  worker-service:
    build:
      context: .
      dockerfile: apps/worker-service/Dockerfile
    container_name: worker_service
    env_file:
      - ./.env
      - ./apps/worker-service/.env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: aviation_frontend
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./apps/frontend/dist:/usr/share/nginx/html
    depends_on:
      - auth-service
      - aircraft-service
      - flight-service
      - operational-event-service
      - performance-capture-service
      - worker-service
