services:
  postgres:
    image: postgres:15
    container_name: aviation-postgres
    restart: always
    environment:
      POSTGRES_DB: aviation_db
      POSTGRES_USER: aviation_user
      POSTGRES_PASSWORD: aviation_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: aviation_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    container_name: auth_service
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - postgres
  aircraft-service:
    build:
      context: .
      dockerfile: apps/aircraft-service/Dockerfile
    container_name: aircraft_service
    env_file:
      - .env
    ports:
      - "3002:3002"
    restart: unless-stopped
    depends_on:
      - postgres
  flight-service:
    build:
      context: .
      dockerfile: apps/flight-service/Dockerfile
    container_name: flight_service
    env_file:
      - .env
    ports:
      - "3001:3001"
    restart: unless-stopped
    depends_on:
      - postgres
  operational-event-service:
    build:
      context: .
      dockerfile: apps/operational-event-service/Dockerfile
    container_name: operational_event_service
    env_file:
      - .env
    ports:
      - "3004:3004"
    restart: unless-stopped
    depends_on:
      - postgres
      - rabbitmq

  performance-capture-service:
    build:
      context: .
      dockerfile: apps/performance-capture-service/Dockerfile
    container_name: performance_capture_service
    env_file:
      - .env
    ports:
      - "3005:3005"
    restart: unless-stopped
    depends_on:
      - postgres

  worker-service:
    build:
      context: .
      dockerfile: apps/worker-service/Dockerfile
    container_name: worker_service
    env_file:
      - .env
    ports:
      - "3008:3008"
    restart: unless-stopped
    depends_on:
      - postgres
      - rabbitmq

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: aviation_frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - auth-service
      - aircraft-service
      - flight-service
      - operational-event-service
      - performance-capture-service
      - worker-service

volumes:
  postgres_data:
  rabbitmq_data:
